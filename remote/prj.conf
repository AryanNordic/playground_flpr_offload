CONFIG_LOG=y
CONFIG_GPIO=y

# Inter-core transport (ICMsg over the shared-memory region in the overlay).
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

# The workload's peripheral driver runs here, on the FLPR, and not on the M33. Its
# Kconfig is not in this file: sysbuild.cmake adds peripherals/<name>/poll.conf or
# irq.conf to this image.

CONFIG_PM=n
