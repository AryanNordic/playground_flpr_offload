# Offloaded configuration: the workload runs on the FLPR, this image receives
# results over the inter-core transport.
CONFIG_APP_OFFLOAD=y

CONFIG_LOG=y
CONFIG_GPIO=y

# Inter-core transport (ICMsg over the shared-memory region in the overlay).
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# M33 active and idle time. SCHED_THREAD_USAGE_ALL adds the per-CPU idle count.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
