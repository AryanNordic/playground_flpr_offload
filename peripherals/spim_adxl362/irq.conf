# ADXL362 on SPIM, interrupt trigger: INT1 data-ready at 100 Hz, handled in the
# driver's own thread, 16 samples per batch.
CONFIG_SENSOR=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ADXL362_TRIGGER_OWN_THREAD=y
# 100 Hz output data rate (the driver default is 12.5 Hz).
CONFIG_ADXL362_ACCEL_ODR_100=y
CONFIG_APP_SENSOR_ACCEL=y
# The raw batch is x, y, z triplets.
CONFIG_APP_RAW_CHANNELS=3
