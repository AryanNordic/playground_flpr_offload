# LIS2DH12 on TWIM, timer trigger: one sensor read per batch.
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_LIS2DH_TRIGGER_NONE=y
# 100 Hz output data rate.
CONFIG_LIS2DH_ODR_5=y
CONFIG_APP_SENSOR_ACCEL=y
# The raw batch is x, y, z triplets.
CONFIG_APP_RAW_CHANNELS=3
