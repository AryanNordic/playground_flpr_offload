# Local baseline: the same workload runs on the Cortex-M33. No FLPR image and no
# inter-core transport are built, so this image is the comparison point for the
# offloaded configuration.
CONFIG_APP_OFFLOAD=n

CONFIG_LOG=y
CONFIG_GPIO=y

# In the local build the workload and its peripheral driver run here, on the
# M33. sysbuild.cmake adds the driver Kconfig from peripherals/<name>/.

# M33 active and idle time. SCHED_THREAD_USAGE_ALL adds the per-CPU idle count.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
